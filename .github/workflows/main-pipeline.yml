name: Main Branch CI/CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn clean verify -B -V --no-transfer-progress

      - name: Generate JaCoCo report
        run: mvn jacoco:report -B --no-transfer-progress

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/site/jacoco/
          retention-days: 30

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ build-test, security-scan ]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all service images
        run: |
          for svc in services/*/; do
            svc_name=$(basename "$svc")
            if [ -f "$svc/Dockerfile" ]; then
              echo "Building and pushing $svc_name"
              docker buildx build                 --push                 --tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc_name:latest                 --tag ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc_name:${{ github.sha }}                 -f "$svc/Dockerfile" .
            fi
          done

  deploy-info:
    name: Deployment Information
    runs-on: ubuntu-latest
    needs: [ docker-build-push ]
    steps:
      - run: |
          echo "## Deployment Ready! 🚀"
          echo "Docker images have been built and pushed to ghcr.io"
          echo "To deploy, apply the Kubernetes manifests:"
          echo "\`\`\`bash"
          echo "kubectl apply -f infra/kubernetes/"
          echo "\`\`\`"
