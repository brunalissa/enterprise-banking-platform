name: Pull Request Pipeline

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven (skip tests for compilation check)
        run: mvn compile -B -V --no-transfer-progress

      - name: Run unit tests
        run: mvn test -B --no-transfer-progress

      - name: Generate JaCoCo coverage report
        run: mvn jacoco:report -B --no-transfer-progress

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./services/*/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

      - name: Run code quality checks
        run: mvn checkstyle:check -B --no-transfer-progress || true

      - name: Build Docker images (build only)
        run: |
          for svc in services/*/; do
            svc_name=$(basename "$svc")
            if [ -f "$svc/Dockerfile" ]; then
              echo "Building Docker image for $svc_name"
              docker build -t enterprise-banking-platform/$svc_name:pr-test -f "$svc/Dockerfile" . || true
            fi
          done

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Build & Test Pipeline Complete**\n\n- Compilation: ${{ job.status }}\n- Unit Tests: ${{ job.status }}\n- Docker Build: ${{ job.status }}'
            })
