apiVersion: v1
kind: ConfigMap
metadata:
  name: banking-config
  namespace: banking-platform
data:
  POSTGRES_HOST: "postgres.banking-platform.svc.cluster.local"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis.banking-platform.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.banking-platform.svc.cluster.local:9092"
  JWT_EXPIRATION: "86400000"
---
apiVersion: v1
kind: Secret
metadata:
  name: banking-secrets
  namespace: banking-platform
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  JWT_SECRET: banking-platform-secret-key-must-be-at-least-256-bits-long-for-hs256
