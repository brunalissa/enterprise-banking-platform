server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: JwtAuthenticationFilter
        - id: customer-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/customers/**
          filters:
            - name: JwtAuthenticationFilter
        - id: account-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/accounts/**
          filters:
            - name: JwtAuthenticationFilter
        - id: transaction-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/transactions/**
          filters:
            - name: JwtAuthenticationFilter
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: JwtAuthenticationFilter
        - id: notification-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthenticationFilter
        - id: fraud-detection-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/fraud/**
          filters:
            - name: JwtAuthenticationFilter
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: banking-platform-secret-key-must-be-at-least-256-bits-long-for-hs256

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
